name: DB Types

on:
  push:
    branches: [main, dev]
    paths:
      - "supabase/migrations/**"
      - "lib/supabase/database.types.ts"
  pull_request:
    branches: [main, dev]
    paths:
      - "supabase/migrations/**"
      - "lib/supabase/database.types.ts"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate current DB types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase gen types typescript --project-id xjgpwpiievwgjqjoewhr --schema public > /tmp/database.types.ts

      - name: Fail if the committed types have drifted from the live schema
        run: |
          if ! diff -u lib/supabase/database.types.ts /tmp/database.types.ts; then
            echo "::error::lib/supabase/database.types.ts is out of date. Run 'npm run db:types' locally (needs 'npx supabase login' once per machine) and commit the result."
            exit 1
          fi
